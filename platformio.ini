; PlatformIO Project Configuration File
; ESP32-Dashboard (refactored)

[platformio]
default_envs = nm-display-420

; ─── Common options shared by all environments ───
[env]
platform = espressif32 @ 6.13.0
framework = arduino
build_unflags = -std=gnu++11
build_flags =
    -Wall
    -std=gnu++17
    -Isrc
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Hash/src
test_build_src = false
; NOTE: must be plain "chain" (no +) on Arduino-ESP32 3.x: WiFi's
; `#include "Network.h"` sits behind `#if SOC_WIFI_SUPPORTED` (defined in
; soc_caps.h, not via -D), so the conditional-evaluating chain+/deep+ modes
; wrongly drop the Network dependency -> "Network.h: No such file" errors.
lib_ldf_mode = chain
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    zinggjm/GxEPD2 @ 1.6.8
    ; ESP32Async forks: compatible with both Arduino-ESP32 2.x and 3.x (IDF 5.x)
    esp32async/AsyncTCP @ ^3.3.2
    esp32async/ESPAsyncWebServer @ ^3.7.0
    ; Keep Unity present for `pio test --without-uploading --without-testing`.
    ; The pioarduino platform can otherwise install then prune it before compile.
    throwtheswitch/Unity @ ^2.6.1

; ─── NM Display 420 (LilyGo T-Display-S3 + 4.2" 3-color EPD) ───
[env:nm-display-420]
; Hardware (NM-EPD-420): ESP32-S3 (QFN56) rev v0.2, 16MB quad flash,
; 8MB embedded OCTAL PSRAM (AP_3v3 / 3.3V). The AP_3v3 embedded-PSRAM chip
; variant requires the ESP-IDF 5.x PSRAM init path — the IDF 4.4-based
; bootloaders from platform espressif32 6.x hang during PSRAM init and cause
; an RTC_SW_SYS_RST boot loop regardless of memory_type. Match the official
; NM-EPD-420 factory firmware: pioarduino 54.03.21 = Arduino-ESP32 3.2.x + IDF 5.3.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = lilygo-t-display-s3
monitor_speed = 115200
board_build.partitions = partition/partitions_16mb_ota.csv
board_upload.flash_size = 16MB
board_build.filesystem = littlefs
board_build.embed_files = src/assets/certs/mozilla_crt_bundle.bin
extra_scripts = post:extra_script_fs.py
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.f_cpu = 80000000L
build_src_filter =
    +<*>
    -<bsp/>                         +<bsp/nm_display_420/>
    -<ui/layouts/>                  +<ui/layouts/epd_400x300/>
build_flags =
    ${env.build_flags}
    -DUI_LAYOUT_EPD_400x300
    -DBOARD_HAS_PSRAM
    ; Route Serial + logs to the native USB-Serial/JTAG port (the port used for
    ; flashing/monitoring) so app and crash output is actually visible.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit AHTX0 @ 2.0.5
    adafruit/Adafruit BusIO @ 1.17.4
    adafruit/Adafruit Unified Sensor @ 1.1.15

; ─── DFRobot FireBeetle 2 ESP32-E + 7.5" BW EPD (800×480) ───
[env:dfrobot_firebeetle2_esp32e]
board = dfrobot_firebeetle2_esp32e
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.f_cpu = 80000000L
build_src_filter =
    +<*>
    -<bsp/>                         +<bsp/firebeetle2_esp32e/>
    -<ui/layouts/>                  +<ui/layouts/epd_800x480/>
build_flags =
    ${env.build_flags}
    -DUI_LAYOUT_EPD_800x480
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit BME280 Library @ 2.3.0
    adafruit/Adafruit BusIO @ 1.17.4
    adafruit/Adafruit Unified Sensor @ 1.1.15

; ─── DFRobot FireBeetle ESP32 (micro-USB) + 7.5" BW EPD (800×480) ───
[env:firebeetle32]
board = firebeetle32
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.f_cpu = 80000000L
build_src_filter =
    +<*>
    -<bsp/>                         +<bsp/firebeetle32/>
    -<ui/layouts/>                  +<ui/layouts/epd_800x480/>
build_flags =
    ${env.build_flags}
    -DUI_LAYOUT_EPD_800x480
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit BME280 Library @ 2.3.0
    adafruit/Adafruit BusIO @ 1.17.4
    adafruit/Adafruit Unified Sensor @ 1.1.15
